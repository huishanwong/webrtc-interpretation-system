        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 15px; display: flex; justify-content: center; margin: 0; transition: direction 0.3s ease; }

        .header h2 { margin: 0; font-size: 22px; color: #1e293b; }
        .header p { margin: 5px 0 0; font-size: 12px; color: #94a3b8; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #475569; }
        select, button, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 15px; margin-bottom: 15px; box-sizing: border-box; -webkit-appearance: none; }
        
        /* [MIXER UI] Audio control group */
        .mixer-group { background: #f8fafc; border: 1px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .mixer-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .mixer-row span { font-size: 13px; width: 110px; color: #64748b; flex-shrink: 0; }
        [dir="rtl"] .mixer-row { flex-direction: row-reverse; }
        input[type="range"] { flex-grow: 1; margin: 0; cursor: pointer; height: 6px; background: #cbd5e1; border-radius: 5px; border: none; }
        
        /* [BUTTON STATES] Color coding for actions */
        #startBtn { background: #059669; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        #startBtn.stop { background: #dc2626; }
        #startBtn:disabled { opacity: 0.5; cursor: not-allowed; }
        #bgmBtn { background: #6366f1; color: white; border: none; cursor: pointer; font-weight: 500; transition: 0.3s; }
        #bgmBtn.active { background: #4f46e5; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }

        /* Handle Right-to-Left (RTL) for Arabic */
        if (langCode === 'ar') {
            body.setAttribute('dir', 'rtl');
            topBar.style.justifyContent = 'flex-start';
            instructionLists.forEach(el => el.style.textAlign = 'right');
            document.getElementById('ui-guide-title').style.flexDirection = 'row-reverse';
        } else {
            body.setAttribute('dir', 'ltr');
            topBar.style.justifyContent = 'flex-end';
            instructionLists.forEach(el => el.style.textAlign = 'left');
            document.getElementById('ui-guide-title').style.flexDirection = 'row';
        }

        document.getElementById('ui-main-title').innerText = d.title;
        document.getElementById('ui-sub-title').innerText = d.sub;
        document.getElementById('initBtn').innerText = d.init;
        document.getElementById('ui-label-1').innerText = d.label1;
        document.getElementById('ui-label-2').innerText = d.label2;
        document.getElementById('ui-label-mixer').innerText = d.mixer;
        document.getElementById('ui-span-mic').innerText = d.mic;
        document.getElementById('ui-span-bgm').innerText = d.bgm;
        document.getElementById('ui-label-3').innerText = d.label3;
        document.getElementById('ui-guide-title').innerText = d.guideTitle;
        const list = document.getElementById('ui-guide-list');
        list.innerHTML = '';
        (d.guides || []).forEach(g => { const li = document.createElement('li'); li.innerText = g; list.appendChild(li); });
        
        // Smart Default: Automatically update language label input if not actively broadcasting
        if (!isBroadcasting && d.defaultLang) {
            document.getElementById('langName').value = d.defaultLang;
        }

        updateButtonsAndStatus();
    }

    /* [BGM SYNC] Load music list from server */
    async function fetchMusicList() {
        try {
            const response = await fetch('/api/music-list');
            const files = await response.json();
            const musicSelect = document.getElementById('musicSelect');
            musicSelect.innerHTML = '<option value="">-- Select Music --</option>';
            files.forEach(file => {
                const opt = document.createElement('option');
                opt.value = file;
                opt.innerText = file;
                musicSelect.appendChild(opt);
            });
        } catch (err) { console.error("Failed to load music list", err); }
    }

    /* [UI REFRESH] Logic for button colors and labels based on state */
    function updateButtonsAndStatus() {
        const d = i18n[currentUI] || i18n['en'];
        const startBtn = document.getElementById('startBtn');
        const bgmBtn = document.getElementById('bgmBtn');
        const badge = document.getElementById('statusBadge');
        const lang = document.getElementById('langName').value.trim();

        if (isBroadcasting) {
            startBtn.innerText = d.stop;
            startBtn.classList.add('stop');
            badge.innerText = d.statusLive + lang;
        } else {
            startBtn.innerText = d.start;
            startBtn.classList.remove('stop');
            badge.innerText = startBtn.disabled ? d.statusInactive : d.statusReady;
        }

        if (bgmBufferSource && bgmBufferSource.isPlaying) {
            bgmBtn.innerText = d.bgmBtnPause;
            bgmBtn.classList.add('active');
        } else {
            bgmBtn.innerText = d.bgmBtn;
            bgmBtn.classList.remove('active');
        }
    }

    /* [AUDIO MIXING] BGM playback and listener sync */
    async function toggleBGM() {
        const d = i18n[currentUI] || i18n['en'];
        const lang = document.getElementById('langName').value.trim();
        const selectedFile = document.getElementById('musicSelect').value;

        if (!audioCtx) return alert(d.alertInit);
        if (!selectedFile) return alert(d.alertBgmFile);
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // Stop BGM if already playing
        if (bgmBufferSource && bgmBufferSource.isPlaying) {
            stopBGM();
            socket.emit('bgm-sync', { lang: lang, isPlaying: false, fileName: "" });
            return;
        }

        try {
            const bgmBtn = document.getElementById('bgmBtn');
            bgmBtn.disabled = true;
            bgmBtn.innerText = "...Loading...";

            const response = await fetch(`/music/${selectedFile}`);
            const arrayBuffer = await response.arrayBuffer();
            cachedAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            bgmBufferSource = audioCtx.createBufferSource();
            bgmBufferSource.buffer = cachedAudioBuffer;
            bgmBufferSource.loop = true;
            // Route BGM to both the mixer (for broadcast) and gain control
            bgmBufferSource.connect(bgmGain).connect(mixedDest);
            
            bgmBufferSource.start(0);
            bgmBufferSource.isPlaying = true;

            bgmBtn.disabled = false;
            updateButtonsAndStatus();
            // Tell the server to notify listeners to play the same file locally
            socket.emit('bgm-sync', { lang: lang, isPlaying: true, fileName: selectedFile });
        } catch (e) {
            alert("BGM Error: " + e.message);
            document.getElementById('bgmBtn').disabled = false;
        }
    }

    function stopBGM() {
        if (bgmBufferSource) {
            try { bgmBufferSource.stop(); } catch(e) {}
            bgmBufferSource.isPlaying = false;
        }
        updateButtonsAndStatus();
    }

    /* [INIT] Requesting Mic & Setting up Mixer nodes */
    async function requestMicPermission() {
        try {
            await navigator.mediaDevices.getUserMedia({ audio: true });
            const devices = await navigator.mediaDevices.enumerateDevices();
            const select = document.getElementById('deviceSelect');
            select.innerHTML = '';
            devices.filter(d => d.kind === 'audioinput').forEach(d => {
                const opt = document.createElement('option');
                opt.value = d.deviceId;
                opt.text = d.label || `Mic ${select.length + 1}`;
                select.appendChild(opt);
            });
            
            document.getElementById('initBtn').style.display = 'none';
            document.getElementById('startBtn').disabled = false;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                micGain = audioCtx.createGain(); 
                bgmGain = audioCtx.createGain();
                // Create a virtual destination that merges all sounds
                mixedDest = audioCtx.createMediaStreamDestination();
                
                micGain.gain.value = document.getElementById('micVol').value;
                bgmGain.gain.value = document.getElementById('bgmVol').value;

                // Bind slider inputs to Audio Gain Nodes
                document.getElementById('micVol').oninput = (e) => micGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.01);
                document.getElementById('bgmVol').oninput = (e) => bgmGain.gain.setTargetAtTime(e.target.value, audioCtx.currentTime, 0.01);
            }
            
            await fetchMusicList(); 
            updateButtonsAndStatus();
        } catch (e) { alert("Mic Permission Denied."); }
    }

    /* [BROADCAST] Starting the WebRTC Engine */
    async function toggleBroadcast() {
        const d = i18n[currentUI] || i18n['en'];
        const lang = document.getElementById('langName').value.trim();
        if(!lang) return alert(d.alertLang);

        if (isBroadcasting) {
            isBroadcasting = false;
            socket.emit('admin-stop', lang);
            // Close all active peer connections
            for (let id in peers) { peers[id].close(); delete peers[id]; }
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            document.getElementById('fill').style.width = "0%";
            socket.emit('audio-sync', { lang: lang, vol: 0 });
            updateButtonsAndStatus();
            return;
        }

        try {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            // Capture specific microphone
            micStream = await navigator.mediaDevices.getUserMedia({ 
                audio: { deviceId: { exact: document.getElementById('deviceSelect').value } } 
            });
            micSource = audioCtx.createMediaStreamSource(micStream);
            // Connect Mic to the Mixer
            micSource.connect(micGain).connect(mixedDest);

            // Use the mixed output as the broadcast source
            localStream = mixedDest.stream;
            isBroadcasting = true;
            socket.emit('admin-start', lang);
            setupVisualizer(localStream);
            updateButtonsAndStatus();
        } catch(e) { alert("Broadcast failed: " + e.message); }
    }

    /* [SIGNALING] Handling WebRTC Offer/Answer for new Listeners */
    socket.on('new-listener', async (listenerId) => {
        if (!isBroadcasting) return;
        // Create Peer Connection for EACH listener (SFU-like behavior)
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        peers[listenerId] = pc;
        // Add the mixed broadcast track to this peer
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        
        pc.onicecandidate = (e) => e.candidate && socket.emit('message', { to: listenerId, candidate: e.candidate });
        
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        socket.emit('message', { to: listenerId, sdp: pc.localDescription });
    });

    socket.on('message', async (d) => {
        if (peers[d.from] && d.sdp) await peers[d.from].setRemoteDescription(d.sdp);
        else if (peers[d.from] && d.candidate) await peers[d.from].addIceCandidate(d.candidate);
    });

    /* [MONITOR] Visualizer & Audio Sync for Clients */
    function setupVisualizer(stream) {
        const ans = audioCtx.createAnalyser();
        audioCtx.createMediaStreamSource(stream).connect(ans);
        const data = new Uint8Array(ans.frequencyBinCount);
        const lang = document.getElementById('langName').value.trim();
        const update = () => {
            if(!isBroadcasting) return;
            ans.getByteFrequencyData(data);
            const vol = (data.reduce((a,b)=>a+b)/data.length)*4;
            document.getElementById('fill').style.width = Math.min(vol, 100) + "%";
            // Emit volume to server so client-side visualizers match
            socket.emit('audio-sync', { lang: lang, vol: vol });
            requestAnimationFrame(update);
        };
        update();
    }

    /* [STATS] Update real-time listener count from Socket.IO */
    socket.on('update-stats', (data) => {
        const currentLang = document.getElementById('langName').value.trim();
        const count = data.stats[currentLang] || 0;
        const display = document.getElementById('listenerCount');
        const d = i18n[currentUI] || i18n['en'];
        display.innerText = count + (d.listeners || " Listeners");
        display.style.display = isBroadcasting ? 'block' : 'none';
    });

    // Default Init
    changeUILanguage('en');
</script>
